[package]
name = "snout-psyche"
description = "snout-psyche: an AI gateway for Postgres-backed apps. OpenAI-compatible, routing over your own provider keys, with budgets and the request log in the project's own Postgres."
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snoutdata/snout-psyche"
rust-version = "1.98.1"
publish = false

[[bin]]
name = "snout-psyche"
path = "src/main.rs"

# The bench's helper: the fake provider as a server, and the load.
[[bin]]
name = "psyche-bench"
path = "src/bin/psyche-bench.rs"
required-features = ["fake"]

[features]
# The fake provider (src/fake.rs): a local stand-in for OpenAI-style providers that can stream
# slowly, fail, rate-limit and cut a stream, for the tests and the bench. Never in a release build.
fake = []

[dependencies]
# The caller's token: HS256 with the project's JWT secret (jwt.rs). ring is already in the
# lockfile through rustls, so this adds no crypto crate.
ring = "0.17"
base64 = "0.22"
url = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: a request passes through with its keys in the order the caller wrote them, so
# what reaches a provider differs from what was sent only where Psyche meant it to.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

# The network: HTTP/1.1 and HTTP/2 to the providers over rustls, every address checked before a
# connection is made (net.rs), and responses read as streams.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"

# The request log (log.rs): its own connection to Postgres, written to by COPY in batches, never on
# a request's path. std's SystemTime is a timestamptz to it, so no date crate comes with it.
tokio-postgres = "0.7"

# The server: /ai/v1 (and /v1, for clients that take a base URL ending in /v1).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }


# Written out from the stack's workspace, which this crate is published from.
[lints.rust]
# X13: no `unsafe` outside the pgrx boundary. The three extensions under ext/ opt out in
# their own Cargo.toml when pgrx arrives, and nowhere else may.
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# For iterating on a build host: release speed without fat LTO's link time. Numbers that are
# reported (sizes, the bench) come from `release`, never from this.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

# Its own workspace: this repository is not part of any other.
[workspace]
